{% extends "base.html" %}
{% block title %}{{ action }} Notice - HMS{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-megaphone me-2" style="color:#008080;"></i>{{ action }} Notice</h2>
    <a href="{{ url_for('notices.index') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Title *</label>
                        <input type="text" name="title" class="form-control" value="{{ notice.title if notice else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Priority</label>
                        <select name="priority" class="form-select">
                            {% for p in ['Normal', 'High'] %}
                            <option value="{{ p }}" {% if notice and notice.priority == p %}selected{% endif %}>{{ p }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Content *</label>
                        <textarea name="content" class="form-control" rows="5" required>{{ notice.content if notice else '' }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn" style="background-color:#008080;color:white;"><i class="bi bi-send me-1"></i>{{ action }} Notice</button>
                        <a href="{{ url_for('notices.index') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
```

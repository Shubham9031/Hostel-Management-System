{% extends "base.html" %}
{% block title %}{{ action }} Complaint - HMS{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-chat-left-text me-2" style="color:#008080;"></i>{{ action }} Complaint</h2>
    <a href="{{ url_for('complaints.index') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <form method="POST">
            {% if current_user.role in ['admin', 'warden'] and students %}
            <div class="mb-3">
                <label class="form-label">Student</label>
                <select name="student_id" class="form-select">
                    <option value="">Select Student (optional)</option>
                    {% for s in students %}
                    <option value="{{ s._id|string }}">{{ s.name }} ({{ s.roll_number }})</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label">Category *</label>
                <select name="category" class="form-select" required>
                    {% for cat in ['Maintenance', 'Electrical', 'Plumbing', 'Cleanliness', 'Food', 'Security', 'Internet', 'Other'] %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label">Description *</label>
                <textarea name="description" class="form-control" rows="4" required placeholder="Describe your complaint in detail...">{{ complaint.description if complaint else '' }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn" style="background-color:#008080;color:white;"><i class="bi bi-send me-1"></i>Submit Complaint</button>
                <a href="{{ url_for('complaints.index') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

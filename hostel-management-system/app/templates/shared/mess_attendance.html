{% extends "base.html" %}
{% block title %}Mess Attendance - HMS{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-clipboard-check me-2" style="color:#008080;"></i>Mess Attendance</h2>
    <a href="{{ url_for('mess.menu') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <form method="POST">
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label">Date</label>
                    <input type="date" name="date" class="form-control" value="{{ attendance_date }}" max="{{ today }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Meal</label>
                    <select name="meal_type" class="form-select">
                        {% for m in ['breakfast', 'lunch', 'dinner'] %}
                        <option value="{{ m }}" {% if meal_type == m %}selected{% endif %}>{{ m|capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-secondary" onclick="this.form.submit()">Load</button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead><tr><th>Student</th><th>Roll No</th><th>Present</th></tr></thead>
                    <tbody>
                        {% for s in students %}
                        <tr>
                            <td>{{ s.name }}</td>
                            <td>{{ s.roll_number }}</td>
                            <td>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" name="present_students" value="{{ s._id|string }}" {% if existing.get(s._id|string, False) %}checked{% endif %}>
                                </div>
                            </td>
                        </tr>
                        {% else %}
                        <tr><td colspan="3" class="text-center text-muted">No students found.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <button type="submit" class="btn" style="background-color:#008080;color:white;"><i class="bi bi-check-circle me-1"></i>Save Attendance</button>
        </form>
    </div>
</div>
{% endblock %}

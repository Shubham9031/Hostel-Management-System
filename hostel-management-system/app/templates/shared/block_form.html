{% extends "base.html" %}
{% block title %}{{ action }} Block - HMS{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-grid me-2" style="color:#008080;"></i>{{ action }} Block</h2>
    <a href="{{ url_for('rooms.blocks') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Block Name *</label>
                <input type="text" name="name" class="form-control" value="{{ block.name if block else '' }}" required placeholder="e.g., Block A">
            </div>
            <div class="mb-3">
                <label class="form-label">Number of Floors</label>
                <input type="number" name="floors" class="form-control" value="{{ block.floors if block else 1 }}" min="1" max="20">
            </div>
            <div class="mb-4">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="2">{{ block.description if block else '' }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn" style="background-color:#008080;color:white;"><i class="bi bi-check-circle me-1"></i>{{ action }} Block</button>
                <a href="{{ url_for('rooms.blocks') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

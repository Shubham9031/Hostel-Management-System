{% extends "base.html" %}
{% block title %}Edit Mess Menu - HMS{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-egg-fried me-2" style="color:#008080;"></i>Edit Mess Menu</h2>
    <a href="{{ url_for('mess.menu') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <form method="POST">
            {% for day in days %}
            <div class="card mb-3 border-0" style="background-color:#f8f9fa;">
                <div class="card-body">
                    <h5 class="card-title mb-3" style="color:#008080;">{{ day }}</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label small">Breakfast</label>
                            <input type="text" name="{{ day }}_breakfast" class="form-control form-control-sm" value="{{ menu[day].breakfast if menu[day] else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small">Lunch</label>
                            <input type="text" name="{{ day }}_lunch" class="form-control form-control-sm" value="{{ menu[day].lunch if menu[day] else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small">Dinner</label>
                            <input type="text" name="{{ day }}_dinner" class="form-control form-control-sm" value="{{ menu[day].dinner if menu[day] else '' }}">
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn" style="background-color:#008080;color:white;"><i class="bi bi-check-circle me-1"></i>Save Menu</button>
                <a href="{{ url_for('mess.menu') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
```

{% extends "base.html" %}
{% block title %}Apply for Leave - HMS{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-calendar-plus me-2" style="color:#008080;"></i>Apply for Leave/Outpass</h2>
    <a href="{{ url_for('leaves.index') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <select name="leave_type" class="form-select">
                            <option value="Leave">Leave</option>
                            <option value="Outpass">Outpass</option>
                        </select>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label">From Date *</label>
                            <input type="date" name="from_date" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">To Date *</label>
                            <input type="date" name="to_date" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Reason *</label>
                        <textarea name="reason" class="form-control" rows="3" required placeholder="State your reason..."></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn" style="background-color:#008080;color:white;"><i class="bi bi-send me-1"></i>Submit Application</button>
                        <a href="{{ url_for('leaves.index') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
